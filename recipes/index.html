<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Recipes — My Kitchen</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --cream: #f8f3ec; --warm-white: #fdfaf6; --linen: #ede5d8; --sand: #d9cbb8;
    --walnut: #7a5c38; --bark: #4a3018; --ink: #1a1208;
    --border: rgba(154, 125, 90, 0.2); --border-med: rgba(154, 125, 90, 0.35);
  }
  body { font-family: 'Jost', sans-serif; background: var(--cream); color: var(--ink); min-height: 100vh; }
  .page { max-width: 720px; margin: 0 auto; padding: 2.5rem 1.5rem 5rem; }

  .back-btn {
    font-size: 12px; font-weight: 400; letter-spacing: 0.08em;
    text-transform: uppercase; color: var(--walnut); text-decoration: none;
    display: inline-flex; align-items: center; gap: 4px;
    transition: color 0.15s; margin-bottom: 2rem;
  }
  .back-btn:hover { color: var(--bark); }

  .header { margin-bottom: 2rem; padding-bottom: 1.5rem; border-bottom: 0.5px solid var(--border-med); }
  .header h1 { font-family: 'Cormorant Garamond', serif; font-size: 38px; font-weight: 400; color: var(--ink); letter-spacing: 0.01em; line-height: 1; margin-bottom: 4px; }
  .header h1 em { font-style: italic; color: var(--walnut); }
  .header-sub { font-size: 12px; font-weight: 300; letter-spacing: 0.12em; color: var(--walnut); text-transform: uppercase; }

  .section-intro { font-family: 'Cormorant Garamond', serif; font-size: 16px; font-style: italic; color: var(--walnut); margin-bottom: 1.75rem; }

  .category-card {
    display: flex; align-items: center; justify-content: space-between;
    background: var(--warm-white); border: 0.5px solid var(--border);
    border-radius: 12px; padding: 1.1rem 1.5rem; margin-bottom: 0.75rem;
    text-decoration: none; color: inherit;
    transition: background 0.15s, border-color 0.15s;
    position: relative; overflow: hidden;
  }
  .category-card:hover { background: var(--linen); border-color: var(--border-med); }
  .category-card:hover .cat-arrow { transform: translateX(3px); }
  .category-card::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 2px; background: var(--sand); opacity: 0; transition: opacity 0.15s; }
  .category-card:hover::before { opacity: 1; }
  .category-card.empty { opacity: 0.4; pointer-events: none; }

  .cat-left { display: flex; flex-direction: column; gap: 3px; }
  .cat-title { font-family: 'Cormorant Garamond', serif; font-size: 22px; font-weight: 500; color: var(--ink); line-height: 1; }
  .cat-count { font-size: 11px; font-weight: 300; color: var(--walnut); letter-spacing: 0.05em; }
  .cat-arrow { font-size: 16px; color: var(--walnut); transition: transform 0.15s; display: inline-block; }

  @media (max-width: 480px) { .page { padding: 1.5rem 1rem 3rem; } .header h1 { font-size: 28px; } }
</style>
</head>
<body>
<div class="page">

  <a class="back-btn" href="../index.html">← My Kitchen</a>

  <div class="header">
    <h1><em>Recipes</em></h1>
    <div class="header-sub">Tested, refined, and documented.</div>
  </div>

  <p class="section-intro">What we've cooked and loved.</p>

  <a class="category-card" href="pork/index.html">
    <div class="cat-left">
      <div class="cat-title">Pork</div>
      <div class="cat-count" id="count-pork">—</div>
    </div>
    <span class="cat-arrow">→</span>
  </a>

  <a class="category-card" href="chicken/index.html">
    <div class="cat-left">
      <div class="cat-title">Chicken</div>
      <div class="cat-count" id="count-chicken">—</div>
    </div>
    <span class="cat-arrow">→</span>
  </a>

  <a class="category-card" href="fish/index.html">
    <div class="cat-left">
      <div class="cat-title">Fish</div>
      <div class="cat-count" id="count-fish">—</div>
    </div>
    <span class="cat-arrow">→</span>
  </a>

  <a class="category-card" href="pasta/index.html">
    <div class="cat-left">
      <div class="cat-title">Pasta</div>
      <div class="cat-count" id="count-pasta">—</div>
    </div>
    <span class="cat-arrow">→</span>
  </a>

  <a class="category-card" href="onepot/index.html">
    <div class="cat-left">
      <div class="cat-title">One Pot</div>
      <div class="cat-count" id="count-onepot">—</div>
    </div>
    <span class="cat-arrow">→</span>
  </a>

  <a class="category-card" href="premadesauces/index.html">
    <div class="cat-left">
      <div class="cat-title">Pre-made Sauces</div>
      <div class="cat-count" id="count-premadesauces">—</div>
    </div>
    <span class="cat-arrow">→</span>
  </a>

  <a class="category-card empty" href="#">
    <div class="cat-left">
      <div class="cat-title">Sides & vegetables</div>
      <div class="cat-count">coming soon</div>
    </div>
    <span class="cat-arrow">→</span>
  </a>

</div>

<script>
// Each category folder and its known recipe files.
// To update counts: just add the new filename to the array.
// No other changes needed anywhere.

const categories = {
  'count-pork':    ['chops-prosecco-mustard.html'],
  'count-chicken': ['harissa-carrots.html', 'chakhokhbili.html', 'sage-butter-chicken.html'],
  'count-fish':    ['pouch-salmon-pasta.html', 'sushi-roll-nishiki-rice.html'],
  'count-pasta':   ['canned-clam-pasta.html', 'caprese-pasta.html'],
  'count-onepot':  ['lentils-sausage-squash.html', 'whitebeans-braise.html', 'pea-braise-bacon.html'],
  'count-premadesauces':  ['caribbean-chicken.html'],
};

Object.entries(categories).forEach(([id, files]) => {
  const n = files.length;
  document.getElementById(id).textContent = n === 1 ? '1 recipe' : `${n} recipes`;
});
</script>
</body>
</html>
